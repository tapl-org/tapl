[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gap-lang"
dynamic = ["version"]
description = 'Gap: a partial evaluator between a frontend and SSA'
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0 WITH LLVM-exception"}
authors = [
  { name = "Orti Bazar", email = "orti.bazar@gmail.com" },
]
dependencies = []

[project.urls]
Documentation = "https://tapl-lang.org"
Issues = "https://github.com/tapl-org/tapl/issues"
Source = "https://github.com/tapl-org/tapl"

[tool.hatch.version]
path = "src/gap/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gap"]

[tool.hatch.envs.default.scripts]
full-check = [
  "hatch check --fix",
  "hatch test",
]

[tool.hatch.envs.hatch-test]
dependencies = [
  "coverage[toml]>=7.4",
  "pytest",
  "pytest-mock",
  "pytest-randomly",
  "pytest-rerunfailures",
  "pytest-xdist[psutil]",
]

# tests/reader_test.py covers src/gap/reader.py, as in python/tapl-lang.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = [
  "TRY003", # Avoid specifying long messages outside the exception class.
  "EM101",  # Exception must not use a string literal, assign to variable first.
  "EM102",  # Exception must not use an f-string literal, assign to variable first.
]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101"] # asserts are the point of a test

[tool.coverage.run]
source_pkgs = ["gap", "tests"]
branch = true
omit = [
  "src/gap/__about__.py",
]
